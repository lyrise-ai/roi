name: CI

on:
  pull_request:
    branches: [main, alpha-tour]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Fast feedback: no secrets, no build, no browser. Runs alongside Playwright
  # so a lint error or a broken unit test fails the PR in ~1 min instead of 20.
  checks:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The download is ~25s; the apt step behind --with-deps is not cached and
      # is the reason the install step still costs a few seconds on a hit.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # Next's own build cache. Keyed on the lockfile plus the sources, so a
      # source-only change restores the previous build and recompiles the diff.
      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('pages/**', 'src/**', 'styles/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Build once so `next start` serves pre-compiled pages.
      # Without this, `next dev` compiles each page on first request
      # which makes tests 10-30x slower in CI than locally.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_BASE_URL: http://localhost:3777
          NEXT_PUBLIC_ENV: ci
          NEXT_TELEMETRY_DISABLED: 1

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          # ── Supabase ────────────────────────────────────────────────────────
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # ── Test user (for authenticated project) ───────────────────────────
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

          # ── App / misc ──────────────────────────────────────────────────────
          NEXT_PUBLIC_BASE_URL: http://localhost:3777
          NEXT_PUBLIC_ENV: ci
          NEXT_TELEMETRY_DISABLED: 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
