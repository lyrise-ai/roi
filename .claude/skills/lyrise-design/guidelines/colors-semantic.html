<!-- @dsCard group="Colors" viewport="700x180" name="Semantic aliases" subtitle="Status colors mapped onto the secondary palette" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:20px"><div style="display:flex;gap:14px">
<div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="height:72px;border-radius:var(--radius-md);background:var(--success);box-shadow:var(--shadow-inset-hairline)"></div><div style="display:flex;flex-direction:column;gap:2px"><span style="font:var(--type-label);color:var(--text-heading)">--success</span><span style="font:var(--weight-regular) var(--text-xs)/1.4 var(--font-body);color:var(--text-muted)">Grow · #00b8b0</span></div></div>
<div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="height:72px;border-radius:var(--radius-md);background:var(--danger);box-shadow:var(--shadow-inset-hairline)"></div><div style="display:flex;flex-direction:column;gap:2px"><span style="font:var(--type-label);color:var(--text-heading)">--danger</span><span style="font:var(--weight-regular) var(--text-xs)/1.4 var(--font-body);color:var(--text-muted)">Power · #ee3124</span></div></div>
<div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="height:72px;border-radius:var(--radius-md);background:var(--warning);box-shadow:var(--shadow-inset-hairline)"></div><div style="display:flex;flex-direction:column;gap:2px"><span style="font:var(--type-label);color:var(--text-heading)">--warning</span><span style="font:var(--weight-regular) var(--text-xs)/1.4 var(--font-body);color:var(--text-muted)">Sunny · #f7901e</span></div></div>
<div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="height:72px;border-radius:var(--radius-md);background:var(--info);box-shadow:var(--shadow-inset-hairline)"></div><div style="display:flex;flex-direction:column;gap:2px"><span style="font:var(--type-label);color:var(--text-heading)">--info</span><span style="font:var(--weight-regular) var(--text-xs)/1.4 var(--font-body);color:var(--text-muted)">Trust · #5eaee0</span></div></div>
<div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="height:72px;border-radius:var(--radius-md);background:var(--highlight);box-shadow:var(--shadow-inset-hairline)"></div><div style="display:flex;flex-direction:column;gap:2px"><span style="font:var(--type-label);color:var(--text-heading)">--highlight</span><span style="font:var(--weight-regular) var(--text-xs)/1.4 var(--font-body);color:var(--text-muted)">Remarkable · #f04b54</span></div></div>
</div></body></html>
