<!-- @dsCard group="Brand" viewport="700x230" name="Glass effect" subtitle="White 60→25% fill, 40% white hairline, 15px blur" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:20px"><div style="height:190px;border-radius:var(--radius-lg);background-image:var(--bg-reflections),var(--bg-deep);display:flex;gap:16px;align-items:center;padding:20px">
<div style="flex:1;background:var(--glass-fill);border:var(--glass-border);border-radius:var(--radius-glass);box-shadow:var(--shadow-glass);backdrop-filter:var(--glass-blur);padding:18px;color:var(--dark-blue)">
<div style="font:var(--type-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;opacity:.65">Money saved</div>
<div style="font:var(--weight-extrabold) 34px/1.1 var(--font-display)">$500,000</div></div>
<div style="flex:1;background:var(--glass-fill-dark);border:var(--glass-border-dark);border-radius:var(--radius-glass);box-shadow:var(--shadow-glass);backdrop-filter:var(--glass-blur);padding:18px;color:#fff">
<div style="font:var(--type-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;opacity:.65">ROI, year one</div>
<div style="font:var(--weight-extrabold) 34px/1.1 var(--font-display)">4x</div></div>
</div></body></html>
