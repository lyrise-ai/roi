<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:20px"><div style="display:flex;gap:14px;align-items:center">

<div style="position:absolute;inset:22px;border:1px dashed var(--purple-300);border-radius:var(--radius-sm)"></div>
<img src="../assets/logo-full-color.png" alt="LyRise" style="width:100%;display:block;position:relative">
</div>
<div style="flex:.8;display:flex;flex-direction:column;gap:12px;align-items:flex-start">
<img src="../assets/logo-full-color.png" alt="LyRise" style="width:60px">
<span style="font:var(--weight-regular) var(--text-xs)/1.5 var(--font-body);color:var(--text-muted)">Minimum 60px / 20mm wide.<br>Favicon uses the mark at 32×32px — it is not a replacement for the logo.</span>
