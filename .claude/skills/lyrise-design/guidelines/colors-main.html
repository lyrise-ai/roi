<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:20px"><div style="display:flex;gap:14px">
<div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="height:72px;border-radius:var(--radius-md);background:var(--lyrise-purple);box-shadow:var(--shadow-inset-hairline)"></div><div style="display:flex;flex-direction:column;gap:2px"><span style="font:var(--type-label);color:var(--text-heading)">LyRise Purple</span><span style="font:var(--weight-regular) var(--text-xs)/1.4 var(--font-body);color:var(--text-muted)">#6666ff · PANTONE 7669 CP</span></div></div>
<div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="height:72px;border-radius:var(--radius-md);background:var(--dark-blue);box-shadow:var(--shadow-inset-hairline)"></div><div style="display:flex;flex-direction:column;gap:2px"><span style="font:var(--type-label);color:var(--text-heading)">Dark Blue</span><span style="font:var(--weight-regular) var(--text-xs)/1.4 var(--font-body);color:var(--text-muted)">#000022 · PANTONE 296 CP</span></div></div>
<div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="height:72px;border-radius:var(--radius-md);background:var(--brand-grey);box-shadow:var(--shadow-inset-hairline)"></div><div style="display:flex;flex-direction:column;gap:2px"><span style="font:var(--type-label);color:var(--text-heading)">Grey</span><span style="font:var(--weight-regular) var(--text-xs)/1.4 var(--font-body);color:var(--text-muted)">#dfe1df · Cool Gray CP</span></div></div>
</div></body></html>
